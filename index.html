<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOF AR V4</title>
<style>
body{font-family:Arial,"Microsoft YaHei",sans-serif;margin:0;background:#f5f5f5;color:#111}
main{max-width:1200px;margin:0 auto;padding:32px}
h1{font-size:34px}
#status{display:block;margin:18px 0;padding:14px 16px;background:#fff3cd;border:1px solid #ffe69c;border-radius:10px;font-size:18px}
model-viewer{display:block;width:100%;height:68vh;min-height:520px;background:white;border:1px solid #ccc;border-radius:16px}
button[slot="ar-button"]{padding:12px 18px;margin:16px;font-size:18px}
.note{font-size:18px;line-height:1.7}
</style>
</head>
<body>
<main>
<h1>MOF 晶体结构 AR 教学样板 V4</h1>
<div id="status">V4 页面已打开。正在加载 3D 组件……</div>

<model-viewer id="mv"
 src="MOF_AR_teaching_sample.glb"
 alt="MOF crystal structure"
 camera-controls
 auto-rotate
 ar
 ar-modes="webxr scene-viewer quick-look"
 shadow-intensity="1"
 exposure="1"
 loading="eager">
 <button slot="ar-button">在 AR 中查看</button>
</model-viewer>

<p class="note">颜色：Zn 蓝紫色，O 红色，N 蓝色，C 深灰色。此版本已去除 H，并截取晶胞中心区域以提高移动端流畅度。</p>
</main>

<script type="module">
const s = document.getElementById('status');

async function loadModelViewer(){
  try{
    await import('https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js?mofv4=1');
    s.textContent='✅ 3D 组件已通过 jsDelivr 加载，正在读取 MOF 模型……';
  }catch(e1){
    s.textContent='jsDelivr 加载失败，正在尝试备用服务器……';
    try{
      await import('https://unpkg.com/@google/model-viewer@4.0.0/dist/model-viewer.min.js?module');
      s.textContent='✅ 3D 组件已通过备用服务器加载，正在读取 MOF 模型……';
    }catch(e2){
      s.textContent='❌ 两个 3D 组件服务器都无法访问。请把这一行截图发给 ChatGPT。';
      s.style.background='#f8d7da';
      s.style.borderColor='#f1aeb5';
      return;
    }
  }

  await customElements.whenDefined('model-viewer');
  const mv=document.getElementById('mv');

  if (mv.loaded){
    s.textContent='✅ MOF 模型已成功加载。可用鼠标拖动旋转、滚轮缩放。';
    s.style.background='#d1e7dd';
    s.style.borderColor='#a3cfbb';
  }

  mv.addEventListener('load',()=>{
    s.textContent='✅ MOF 模型已成功加载。可用鼠标拖动旋转、滚轮缩放。';
    s.style.background='#d1e7dd';
    s.style.borderColor='#a3cfbb';
  });

  mv.addEventListener('error',()=>{
    s.textContent='❌ 3D 组件已加载，但 GLB 模型读取失败。请把这一行截图发给 ChatGPT。';
    s.style.background='#f8d7da';
    s.style.borderColor='#f1aeb5';
  });
}
loadModelViewer();
</script>
</body>
</html>
